name: Deploy to Supabase

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v3

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase Project
        run: supabase link --project-ref $SUPABASE_PROJECT_ID --password $SUPABASE_DB_PASSWORD

      - name: Deploy Edge Functions
        run: |
          supabase functions deploy scan-ticket --yes
          supabase functions deploy traffic-sync --no-verify-jwt --yes

      # check-geofence stays deleted: APKs < 1.1.6 hammered it (~135k
      # invocations/day vs 500k/month on the free plan). The web app and
      # APK ≥ 1.1.6 call the fn_geofence_check RPC through PostgREST instead.
      # The source is kept in supabase/functions/check-geofence to restore it
      # if ever needed (remove this step and deploy it again).
      - name: Keep check-geofence deleted
        run: supabase functions delete check-geofence --project-ref $SUPABASE_PROJECT_ID --yes || true

      # Migrations are NOT pushed from CI: the remote history diverged from
      # supabase/migrations (several files were applied manually or never),
      # and `db push` could replay old data-cleaning migrations. Apply new
      # migrations explicitly (dashboard SQL editor or Supabase MCP).
