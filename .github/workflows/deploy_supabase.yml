name: Deploy to Supabase

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v3

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase Project
        run: supabase link --project-ref $SUPABASE_PROJECT_ID --password $SUPABASE_DB_PASSWORD

      - name: Deploy Edge Functions
        run: |
          supabase functions deploy check-geofence
          supabase functions deploy scan-ticket

      # Migrations are NOT pushed from CI: the remote history diverged from
      # supabase/migrations (several files were applied manually or never),
      # and `db push` could replay old data-cleaning migrations. Apply new
      # migrations explicitly (dashboard SQL editor or Supabase MCP).
